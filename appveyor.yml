version: '{build}'
image: Visual Studio 2019
environment:
  matrix:
    # job names are used for FTP uploads, try to not change them
    - JOB_NAME: "win32"
      CMAKE_TARGET: "Visual Studio 16 2019"
      PLATFORM: "Win32"
      CMAKE_FLAGS: "-A Win32"
    - JOB_NAME: "win64"
      CMAKE_TARGET: "Visual Studio 16 2019"
      PLATFORM: "x64"
      CMAKE_FLAGS: "-A x64 -DPython3_EXECUTABLE=C:\\Python311-x64\\python.exe -DASAR_GEN_CS_TEST=ON"
    - JOB_NAME: "clang"
      CMAKE_TARGET: "Visual Studio 16 2019"
      PLATFORM: "x64"
      CMAKE_FLAGS: "-T ClangCL -A x64 -DPython3_EXECUTABLE=C:\\Python311-x64\\python.exe -DASAR_GEN_CS_TEST=ON"

install:
- cmd: >-
    mkdir build

    cd build

    vcpkg integrate remove
    
    cmake -G "%CMAKE_TARGET%" %CMAKE_FLAGS% ..\src

on_failure:
- cmd: >-

    type C:\projects\asar\build\CMakeFiles\CMakeOutput.log

    type C:\projects\asar\build\CMakeFiles\CMakeError.log

build:
  verbosity: minimal

artifacts:
- path: build\asar\bin\**\asar.exe
- path: build\asar\lib\**\*asar.dll

configuration: MinSizeRel

test_script:
  - cmd: >-
      cmake --build . --config MinSizeRel --target run-tests

deploy:
  provider: FTP
  protocol: sftp
  host: r9.pm
  username: asar_ftp
  password:
    secure: 2O8zpJfSlxa28ibgfgXNsca2OJhU4TAbOfpLaFcjf1BLqkLsjYHNlQ8p6PkI3Rki
  folder: asar/windows/$(APPVEYOR_REPO_BRANCH)/$(JOB_NAME)/

skip_commits:
  files:
    - docs/
    - ext/
