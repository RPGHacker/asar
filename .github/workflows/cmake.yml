name: CMake

on:
  push:
    branches: [ master, asar_19, asar_2_beta ]
    paths-ignore:
      - 'docs/**'
      - 'ext/**'
  pull_request:
    branches: [ master, asar_19, asar_2_beta ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - name: windows
            os: windows-2022
            # is this even necessary? isn't it the default?
            cmake_opts: '-G "Visual Studio 17 2022"'
          - name: ubuntu
            os: ubuntu-24.04
          - name: osx
            os: macos-14
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure CMake
      run: cmake -S ${{github.workspace}}/src -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} ${{ matrix.cmake_opts }}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    # Uncomment this to get a debug shell on the actions runner
    #- name: debug stuff
    #  uses: mxschmitt/action-tmate@v3

    - name: Tests
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --target run-tests
